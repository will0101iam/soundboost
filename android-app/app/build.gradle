plugins {
    id "com.android.application"
}

android {
    namespace "com.local.soundboost"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.soundboost"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
